# Configuracion HTTP inicial de EROS Allocator.
# bootstrap-ubuntu.sh reemplaza __SERVER_NAME__ por el dominio indicado.
# Despues de validar DNS, Certbot agrega el listener HTTPS y la redireccion.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 1m;

    location /static/ {
        alias /opt/eros-allocator/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
